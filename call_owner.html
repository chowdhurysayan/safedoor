<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>SafeDoor Owner Call</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- FontAwesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        body {
            background-color: #030712;
            font-family: system-ui, -apple-system, sans-serif;
        }
        .pulse-ring {
            animation: pulse 2s infinite;
        }
        @keyframes pulse {
            0% {
                transform: scale(0.95);
                box-shadow: 0 0 0 0 rgba(16, 185, 129, 0.4);
            }
            70% {
                transform: scale(1);
                box-shadow: 0 0 0 20px rgba(16, 185, 129, 0);
            }
            100% {
                transform: scale(0.95);
                box-shadow: 0 0 0 0 rgba(16, 185, 129, 0);
            }
        }
    </style>
</head>
<body class="h-screen w-screen flex flex-col justify-between p-8 text-white select-none">

    <!-- Top Info -->
    <div class="text-center mt-12">
        <span class="px-3 py-1 bg-emerald-500/20 text-emerald-400 font-semibold text-[10px] uppercase tracking-widest rounded-full border border-emerald-500/30">SafeDoor Audio Call</span>
        <h2 id="peerName" class="text-2xl font-bold mt-4 text-slate-100">Visitor</h2>
        <p id="callStatus" class="text-xs text-slate-400 mt-2">Connecting...</p>

        <!-- Reconnecting Visual Badge -->
        <div id="reconnectingBadge" class="hidden mt-2.5 inline-flex items-center gap-2 px-3.5 py-1.5 bg-amber-500/20 text-amber-300 font-bold text-xs rounded-full border border-amber-500/40 animate-pulse shadow-lg shadow-amber-950/30">
            <i class="fa-solid fa-arrows-rotate animate-spin text-amber-400"></i>
            <span>Connection Unstable • Reconnecting...</span>
        </div>

        <!-- Connection Quality Indicator (Signal Bars) -->
        <div id="qualityIndicator" class="inline-flex items-center gap-2 mt-3 px-3.5 py-1.5 bg-slate-900/90 border border-slate-800 rounded-full text-xs shadow-md">
            <div id="signalBars" class="flex items-end gap-1 h-3.5 w-5">
                <div id="sig1" class="w-1 rounded-xs bg-slate-600 h-1.5 transition-all duration-300"></div>
                <div id="sig2" class="w-1 rounded-xs bg-slate-600 h-2.5 transition-all duration-300"></div>
                <div id="sig3" class="w-1 rounded-xs bg-slate-600 h-3.5 transition-all duration-300"></div>
                <div id="sig4" class="w-1 rounded-xs bg-slate-600 h-4 transition-all duration-300"></div>
            </div>
            <span id="qualityText" class="font-semibold text-[11px] text-slate-400">Signal: Connecting...</span>
        </div>

        <!-- Call Duration & Subtle Progress Bar -->
        <div id="callProgressContainer" class="w-full max-w-xs mx-auto mt-4 px-1 hidden transition-all duration-300">
            <div class="flex items-center justify-between text-[11px] font-semibold text-slate-400 mb-1.5">
                <span class="flex items-center gap-1.5 text-emerald-400">
                    <span class="w-2 h-2 rounded-full bg-emerald-500 animate-pulse"></span>
                    <span id="callProgressStatus">Live Call</span>
                </span>
                <span id="callProgressBarTimer" class="font-mono text-slate-200">00:00</span>
            </div>
            <div class="w-full h-1.5 bg-slate-900/90 rounded-full overflow-hidden p-0.5 border border-slate-800 shadow-inner">
                <div id="callProgressBar" class="h-full bg-gradient-to-r from-emerald-500 via-teal-400 to-cyan-400 rounded-full w-0 transition-all duration-500 ease-out shadow-[0_0_8px_rgba(52,211,153,0.6)]"></div>
            </div>
        </div>

        <!-- Push Notification Status Badge / Request Button -->
        <div id="notiBanner" class="mt-2 flex items-center justify-center">
            <button id="notiBtn" onclick="requestNotificationPermission()" class="inline-flex items-center gap-1.5 px-3 py-1 bg-slate-900/90 hover:bg-slate-800 border border-slate-800 rounded-full text-[11px] font-semibold text-slate-300 transition duration-150 cursor-pointer shadow-sm">
                <i id="notiIcon" class="fa-solid fa-bell text-amber-400"></i>
                <span id="notiBtnText">Enable Push Alerts</span>
            </button>
        </div>
    </div>

    <!-- Animated Waveform Visualizer -->
    <div class="flex items-center justify-center relative my-12">
        <!-- Dashed spinning outer amber ring shown during Reconnecting state -->
        <div id="reconnectingRing" class="hidden absolute w-36 h-36 rounded-full border-2 border-dashed border-amber-400/80 animate-[spin_4s_linear_infinite] z-0"></div>
        <!-- Rotating dots overlay shown while calling/connecting -->
        <div id="connectingDots" class="absolute w-32 h-32 flex items-center justify-center animate-[spin_3s_linear_infinite] z-0 transition-all duration-300">
            <div class="absolute top-0 w-2.5 h-2.5 bg-emerald-400 rounded-full shadow-[0_0_8px_rgba(52,211,153,0.8)]"></div>
            <div class="absolute right-0 w-2.5 h-2.5 bg-emerald-400/70 rounded-full"></div>
            <div class="absolute bottom-0 w-2.5 h-2.5 bg-emerald-400/40 rounded-full"></div>
            <div class="absolute left-0 w-2.5 h-2.5 bg-emerald-400/20 rounded-full"></div>
            <div class="absolute top-2 left-2 w-2 h-2 bg-emerald-400/10 rounded-full"></div>
            <div class="absolute top-2 right-2 w-2 h-2 bg-emerald-400/90 rounded-full shadow-[0_0_6px_rgba(52,211,153,0.6)]"></div>
            <div class="absolute bottom-2 left-2 w-2 h-2 bg-emerald-400/30 rounded-full"></div>
            <div class="absolute bottom-2 right-2 w-2 h-2 bg-emerald-400/50 rounded-full"></div>
        </div>
        <div id="pulseRing1" class="w-24 h-24 bg-emerald-500/10 rounded-full absolute animate-ping"></div>
        <div id="pulseRing2" class="w-24 h-24 bg-emerald-500/20 rounded-full absolute pulse-ring"></div>
        <div class="w-20 h-20 bg-emerald-600 rounded-full flex items-center justify-center relative z-10 shadow-lg border border-emerald-400/40">
            <i class="fa-solid fa-microphone text-3xl text-white"></i>
        </div>
    </div>

    <!-- Controls -->
    <div class="w-full max-w-xs mx-auto flex flex-col gap-4 mb-8">
        <div class="grid grid-cols-2 gap-3">
            <button id="muteBtn" onclick="toggleMute()" class="py-3.5 bg-slate-900/90 hover:bg-slate-800 active:bg-slate-700 border border-slate-700/80 font-semibold rounded-2xl text-xs transition duration-150 flex items-center justify-center gap-2 text-slate-200 shadow-md">
                <i id="muteIcon" class="fa-solid fa-microphone-slash text-slate-300"></i>
                <span id="muteText">Mute</span>
            </button>
            <button id="speakerOwnerBtn" onclick="toggleSpeakerphoneOwner()" class="py-3.5 bg-slate-900/90 hover:bg-slate-800 active:bg-slate-700 border border-emerald-500/40 font-semibold rounded-2xl text-xs transition duration-150 flex items-center justify-center gap-2 text-emerald-400 shadow-md">
                <i id="speakerOwnerIcon" class="fa-solid fa-volume-high text-emerald-400"></i>
                <span id="speakerOwnerText">Speakerphone</span>
            </button>
        </div>
        <!-- Distinct accent color End Call button to prevent accidental hangups -->
        <button onclick="hangup()" class="w-full py-3.5 bg-gradient-to-r from-rose-600 via-red-600 to-rose-700 hover:from-rose-500 hover:to-red-600 active:scale-[0.98] text-white font-bold text-xs rounded-2xl border-2 border-rose-400/40 shadow-[0_0_20px_rgba(225,29,72,0.35)] flex items-center justify-center gap-2.5 transition-all duration-200 cursor-pointer">
            <i class="fa-solid fa-phone-slash text-sm"></i>
            <span class="tracking-wide">End Call</span>
        </button>
    </div>

    <audio id="remoteAudio" autoplay playsinline style="display:none;"></audio>

    <!-- Live WebRTC & Signaling Debugger Console -->
    <div id="callDebuggerContainer" class="w-full max-w-xs sm:max-w-sm mx-auto mt-2 mb-6 bg-slate-950/95 border border-slate-800 rounded-2xl overflow-hidden shadow-2xl text-left">
        <div class="bg-slate-900/90 px-3.5 py-2.5 border-b border-slate-800/80 flex items-center justify-between">
            <div class="flex items-center gap-2">
                <span class="relative flex h-2 w-2">
                    <span class="animate-ping absolute inline-flex h-full w-full rounded-full bg-emerald-400 opacity-75"></span>
                    <span class="relative inline-flex rounded-full h-2 w-2 bg-emerald-500"></span>
                </span>
                <span class="font-mono text-[11px] font-bold tracking-wide text-slate-200">RTC Debugger Console</span>
            </div>
            <div class="flex items-center gap-1.5">
                <button onclick="copyDebugLogs()" class="px-2.5 py-1 bg-indigo-600 hover:bg-indigo-500 active:scale-95 text-white text-[10px] font-bold rounded-lg transition-all flex items-center gap-1 cursor-pointer shadow-sm">
                    <i class="fa-solid fa-copy text-[10px]"></i>
                    <span>Copy All Logs</span>
                </button>
                <button onclick="clearDebugLogs()" class="px-2 py-1 bg-slate-800 hover:bg-slate-700 text-slate-300 text-[10px] font-medium rounded-lg transition-all cursor-pointer" title="Clear Console">
                    <i class="fa-solid fa-trash-can text-[10px]"></i>
                </button>
                <button onclick="toggleDebugConsole()" class="px-2 py-1 bg-slate-800 hover:bg-slate-700 text-slate-300 text-[10px] font-medium rounded-lg transition-all cursor-pointer" title="Toggle Size">
                    <i id="debugToggleIcon" class="fa-solid fa-chevron-down text-[10px]"></i>
                </button>
            </div>
        </div>
        <div id="debugLogsBox" class="p-3 max-h-56 overflow-y-auto font-mono text-[10px] leading-relaxed space-y-1.5 select-text bg-slate-950/95 scrollbar-thin scrollbar-thumb-slate-800">
            <!-- Dynamic logs -->
        </div>
        <div id="copyToast" class="hidden bg-emerald-600 text-white text-[10px] font-bold py-1.5 px-3 text-center transition-all">
            Copied debug logs to clipboard!
        </div>
    </div>

    <script>
        let debugLogsBuffer = [];

        function addDebugLog(category, message, details = null) {
            const now = new Date();
            const timeStr = now.toTimeString().split(' ')[0] + '.' + String(now.getMilliseconds()).padStart(3, '0');
            
            let colorClass = "text-slate-300";
            switch(category.toUpperCase()) {
                case 'INIT': colorClass = "text-cyan-400"; break;
                case 'MEDIA': colorClass = "text-teal-300"; break;
                case 'SIGNAL OUT': colorClass = "text-indigo-400"; break;
                case 'SIGNAL IN': colorClass = "text-emerald-400 font-semibold"; break;
                case 'RTC STATE': colorClass = "text-amber-300 font-semibold"; break;
                case 'ICE': colorClass = "text-sky-300"; break;
                case 'ERROR': colorClass = "text-rose-400 font-bold"; break;
                case 'WARN': colorClass = "text-yellow-400"; break;
                default: colorClass = "text-slate-300";
            }

            let detailStr = details ? (typeof details === 'object' ? JSON.stringify(details, null, 2) : String(details)) : '';
            const rawLine = `[${timeStr}] [${category}] ${message}${detailStr ? ' -> ' + detailStr : ''}`;
            debugLogsBuffer.push(rawLine);

            const logsBox = document.getElementById('debugLogsBox');
            if (logsBox) {
                const logItem = document.createElement('div');
                logItem.className = `break-all ${colorClass}`;
                
                let html = `<span class="text-slate-500">[${timeStr}]</span> <span class="font-bold">[${category}]</span> ${escapeHtml(message)}`;
                if (detailStr) {
                    html += `<pre class="mt-0.5 p-1 bg-slate-900/90 border border-slate-800/80 rounded text-[9px] text-slate-300 overflow-x-auto select-all whitespace-pre-wrap">${escapeHtml(detailStr)}</pre>`;
                }
                logItem.innerHTML = html;
                logsBox.appendChild(logItem);
                logsBox.scrollTop = logsBox.scrollHeight;
            }
        }

        function escapeHtml(str) {
            return String(str)
                .replace(/&/g, "&amp;")
                .replace(/</g, "&lt;")
                .replace(/>/g, "&gt;")
                .replace(/"/g, "&quot;")
                .replace(/'/g, "&#039;");
        }

        function copyDebugLogs() {
            if (debugLogsBuffer.length === 0) {
                alert("No debug logs to copy yet.");
                return;
            }
            const fullText = debugLogsBuffer.join('\n');
            if (navigator.clipboard && navigator.clipboard.writeText) {
                navigator.clipboard.writeText(fullText).then(() => {
                    showCopyToast(`Copied ${debugLogsBuffer.length} log entries to clipboard!`);
                }).catch(() => fallbackCopyText(fullText));
            } else {
                fallbackCopyText(fullText);
            }
        }

        function fallbackCopyText(fullText) {
            const textarea = document.createElement('textarea');
            textarea.value = fullText;
            document.body.appendChild(textarea);
            textarea.select();
            document.execCommand('copy');
            document.body.removeChild(textarea);
            showCopyToast(`Copied ${debugLogsBuffer.length} log entries to clipboard!`);
        }

        function showCopyToast(msg) {
            const toast = document.getElementById('copyToast');
            if (toast) {
                toast.innerText = msg;
                toast.classList.remove('hidden');
                setTimeout(() => toast.classList.add('hidden'), 2500);
            }
        }

        function clearDebugLogs() {
            debugLogsBuffer = [];
            const logsBox = document.getElementById('debugLogsBox');
            if (logsBox) logsBox.innerHTML = '<div class="text-slate-500 italic">Console logs cleared.</div>';
        }

        function toggleDebugConsole() {
            const logsBox = document.getElementById('debugLogsBox');
            const icon = document.getElementById('debugToggleIcon');
            if (logsBox) {
                if (logsBox.classList.contains('hidden')) {
                    logsBox.classList.remove('hidden');
                    if (icon) icon.className = "fa-solid fa-chevron-down text-[10px]";
                } else {
                    logsBox.classList.add('hidden');
                    if (icon) icon.className = "fa-solid fa-chevron-up text-[10px]";
                }
            }
        }

        // Get parameters from query string
        const urlParams = new URLSearchParams(window.location.search);
        const token = urlParams.get('token');
        const visitorName = urlParams.get('visitorName') || "Visitor";
        const isCaller = urlParams.get('isCaller') === 'true';
        const visitorTimestamp = urlParams.get('visitorTimestamp');

        document.getElementById('peerName').innerText = visitorName;

        let localStream = null;
        let peerConnection = null;
        let eventSource = null;
        let callTimerInterval = null;
        let callSeconds = 0;
        let isMuted = false;
        let iceCandidatesQueue = [];

        const callSessionStartTime = Date.now() - 5000;

        const rtcConfig = {
            iceServers: [
                { urls: 'stun:stun.l.google.com:19302' },
                { urls: 'stun:stun1.l.google.com:19302' },
                { urls: 'stun:stun2.l.google.com:19302' },
                { urls: 'stun:stun3.l.google.com:19302' },
                { urls: 'stun:stun4.l.google.com:19302' },
                { urls: 'stun:global.stun.twilio.com:3478' },
                { urls: 'stun:stun.services.mozilla.com' },
                {
                    urls: 'turn:openrelay.metered.ca:80',
                    username: 'openrelayproject',
                    credential: 'openrelayproject'
                },
                {
                    urls: 'turn:openrelay.metered.ca:443',
                    username: 'openrelayproject',
                    credential: 'openrelayproject'
                },
                {
                    urls: 'turns:openrelay.metered.ca:443?transport=tcp',
                    username: 'openrelayproject',
                    credential: 'openrelayproject'
                }
            ]
        };

        // MD5 implementation for generating topic hash
        function md5(string) {
            function RotateLeft(lValue, iShiftBits) {
                return (lValue<<iShiftBits) | (lValue>>>(32-iShiftBits));
            }
            function AddUnsigned(lX,lY) {
                var lX4,lY4,lX8,lY8,lResult;
                lX8 = (lX & 0x80000000);
                lY8 = (lY & 0x80000000);
                lX4 = (lX & 0x40000000);
                lY4 = (lY & 0x40000000);
                lResult = (lX & 0x3FFFFFFF)+(lY & 0x3FFFFFFF);
                if (lX4 & lY4) {
                    return (lResult ^ 0x80000000 ^ lX8 ^ lY8);
                }
                if (lX4 | lY4) {
                    if (lResult & 0x40000000) {
                        return (lResult ^ 0xC0000000 ^ lX8 ^ lY8);
                    } else {
                        return (lResult ^ 0x40000000 ^ lX8 ^ lY8);
                    }
                } else {
                    return (lResult ^ lX8 ^ lY8);
                }
            }
            function F(x,y,z) { return (x & y) | ((~x) & z); }
            function G(x,y,z) { return (x & z) | (y & (~z)); }
            function H(x,y,z) { return (x ^ y ^ z); }
            function I(x,y,z) { return (y ^ (x | (~z))); }
            function FF(a,b,c,d,x,s,ac) {
                a = AddUnsigned(a, AddUnsigned(AddUnsigned(F(b,c,d), x), ac));
                return AddUnsigned(RotateLeft(a,s),b);
            };
            function GG(a,b,c,d,x,s,ac) {
                a = AddUnsigned(a, AddUnsigned(AddUnsigned(G(b,c,d), x), ac));
                return AddUnsigned(RotateLeft(a,s),b);
            };
            function HH(a,b,c,d,x,s,ac) {
                a = AddUnsigned(a, AddUnsigned(AddUnsigned(H(b,c,d), x), ac));
                return AddUnsigned(RotateLeft(a,s),b);
            };
            function II2(a,b,c,d,x,s,ac) {
                a = AddUnsigned(a, AddUnsigned(AddUnsigned(I(b,c,d), x), ac));
                return AddUnsigned(RotateLeft(a,s),b);
            };
            function ConvertToWordArray(string) {
                var lWordCount;
                var lMessageLength = string.length;
                var lNumberOfWords_temp1=lMessageLength + 8;
                var lNumberOfWords_temp2=(lNumberOfWords_temp1-(lNumberOfWords_temp1 % 64))/64;
                var lNumberOfWords = (lNumberOfWords_temp2+1)*16;
                var lWordArray=Array(lNumberOfWords-1);
                var lBytePosition = 0;
                var lByteCount = 0;
                while ( lByteCount < lMessageLength ) {
                    lWordCount = (lByteCount-(lByteCount % 4))/4;
                    lBytePosition = (lByteCount % 4)*8;
                    lWordArray[lWordCount] = (lWordArray[lWordCount] | (string.charCodeAt(lByteCount)<<lBytePosition));
                    lByteCount++;
                }
                lWordCount = (lByteCount-(lByteCount % 4))/4;
                lBytePosition = (lByteCount % 4)*8;
                lWordArray[lWordCount] = lWordArray[lWordCount] | (0x80<<lBytePosition);
                lWordArray[lNumberOfWords-2] = lMessageLength<<3;
                lWordArray[lNumberOfWords-1] = lMessageLength>>>29;
                return lWordArray;
            };
            function WordToHex(lValue) {
                var WordToHexValue="",WordToHexValue_temp="",lByte,lCount;
                for (lCount=0;lCount<=3;lCount++) {
                    lByte = (lValue>>>(lCount*8)) & 255;
                    WordToHexValue_temp = "0" + lByte.toString(16);
                    WordToHexValue = WordToHexValue + WordToHexValue_temp.substr(WordToHexValue_temp.length-2,2);
                }
                return WordToHexValue;
            };
            function Utf8Encode(string) {
                string = string.replace(/\r\n/g,"\n");
                var utftext = "";
                for (var n = 0; n < string.length; n++) {
                    var c = string.charCodeAt(n);
                    if (c < 128) {
                        utftext += String.fromCharCode(c);
                    }
                    else if((c > 127) && (c < 2048)) {
                        utftext += String.fromCharCode((c >> 6) | 192);
                        utftext += String.fromCharCode((c & 63) | 128);
                    }
                    else {
                        utftext += String.fromCharCode((c >> 12) | 224);
                        utftext += String.fromCharCode(((c >> 6) & 63) | 128);
                        utftext += String.fromCharCode((c & 63) | 128);
                    }
                }
                return utftext;
            };
            var x=Array();
            var k,S11,S12,S13,S14,S21,S22,S23,S24,S31,S32,S33,S34,S41,S42,S43,S44;
            string = Utf8Encode(string);
            x = ConvertToWordArray(string);
            var a = 0x67452301; var b = 0xEFCDAB89; var c = 0x98BADCFE; var d = 0x10325476;
            S11=7; S12=12; S13=17; S14=22;
            S21=5; S22=9; S23=14; S24=20;
            S31=4; S32=11; S33=16; S34=23;
            S41=6; S42=10; S43=15; S44=21;
            for (k=0;k<x.length;k+=16) {
                var AA=a; var BB=b; var CC=c; var DD=d;
                a=II2(a,b,c,d,x[k+0], S11,0xD76AA478); d=II2(d,a,b,c,x[k+1], S12,0xE8C7B756); c=II2(c,d,a,b,x[k+2], S13,0x242070DB); b=II2(b,c,d,a,x[k+3], S14,0xC1BDCEEE);
                a=II2(a,b,c,d,x[k+4], S11,0xF57C0FAF); d=II2(d,a,b,c,x[k+5], S12,0x4787C62A); c=II2(c,d,a,b,x[k+6], S13,0xA8304613); b=II2(b,c,d,a,x[k+7], S14,0xFD469501);
                a=II2(a,b,c,d,x[k+8], S11,0x698098D8); d=II2(d,a,b,c,x[k+9], S12,0x8B44F7AF); c=II2(c,d,a,b,x[k+10],S13,0xFFFF5BB1); b=II2(b,c,d,a,x[k+11],S14,0x895CD7BE);
                a=II2(a,b,c,d,x[k+12],S11,0x6B901122); d=II2(d,a,b,c,x[k+13],S12,0xFD987193); c=II2(c,d,a,b,x[k+14],S13,0xA679438E); b=II2(b,c,d,a,x[k+15],S14,0x49B40821);
                a=GG(a,b,c,d,x[k+1], S21,0xF61E2562); d=GG(d,a,b,c,x[k+6], S22,0xC040B340); c=GG(c,d,a,b,x[k+11],S23,0x265E5A51); b=GG(b,c,d,a,x[k+0], S24,0xE9B6C7AA);
                a=GG(a,b,c,d,x[k+5], S21,0xD62F105D); d=GG(d,a,b,c,x[k+10],S22,0x2441453);  c=GG(c,d,a,b,x[k+15],S23,0xD8A1E681); b=GG(b,c,d,a,x[k+4], S24,0xE7D3FBC8);
                a=GG(a,b,c,d,x[k+9], S21,0x21E1CDE6); d=GG(d,a,b,c,x[k+14],S22,0xC33707D6); c=GG(c,d,a,b,x[k+3], S23,0xF4D50D87); b=GG(b,c,d,a,x[k+8], S24,0x455A14ED);
                a=GG(a,b,c,d,x[k+13],S21,0xA9E3E905); d=GG(d,a,b,c,x[k+2], S22,0xFCEFA3F8); c=GG(c,d,a,b,x[k+7], S23,0x676F02D9); b=GG(b,c,d,a,x[k+12],S24,0x8D2A4C8A);

        async function sendCallSignal(signalText) {
            const now = Date.now();
            const signalCommand = signalText.substring(0, signalText.indexOf(':') > -1 ? signalText.indexOf(':') : signalText.length);
            try {
                const payload = {
                    type: "chat_message",
                    sender: "Owner",
                    visitorTimestamp: Number(visitorTimestamp) || 0,
                    message: `_webrtc_call_:${signalText}`,
                    timestamp: now
                };

                addDebugLog('SIGNAL OUT', `Sending '${signalCommand}' signal to ntfy topic '${ntfyTopic}'`, { payloadLength: signalText.length, sender: "Owner" });

                const response = await fetch(`https://ntfy.sh/${ntfyTopic}`, {
                    method: 'POST',
                    body: JSON.stringify(payload)
                });

                addDebugLog('SIGNAL OUT', `Signal '${signalCommand}' POST response status: ${response.status}`, { ok: response.ok });
            } catch (e) {
                addDebugLog('ERROR', `Error sending signal '${signalCommand}': ${e.message}`, e);
                console.error("Error sending signaling message:", e);
            }
        }

        async function requestNotificationPermission() {
            if (!("Notification" in window)) {
                alert("This browser does not support desktop notifications.");
                return;
            }
            try {
                const permission = await Notification.requestPermission();
                updateNotificationUI(permission);
                if (permission === "granted") {
                    triggerBrowserNotification("🔔 SafeDoor Push Alerts Active", {
                        body: "You will receive immediate pop-up alerts when visitors arrive, even if this tab is inactive!",
                        tag: "safedoor-test"
                    });
                } else if (permission === "denied") {
                    alert("Push notifications are blocked in your browser settings. Please grant notification permissions to receive visitor alerts.");
                }
            } catch (e) {
                console.error("Error requesting notification permission:", e);
            }
        }

        function updateNotificationUI(status) {
            const btnText = document.getElementById('notiBtnText');
            const icon = document.getElementById('notiIcon');
            if (!btnText || !icon) return;

            if (status === "granted") {
                btnText.innerText = "Alerts Active";

            } else if (status === "denied") {
                btnText.innerText = "Alerts Blocked";

            } else if (status === "unsupported") {
                btnText.innerText = "Alerts Unsupported";

        function triggerHapticFeedback() {
            if (window.AndroidCall && typeof window.AndroidCall.vibrate === 'function') {
                try {

                } catch (e) {

        function triggerBrowserNotification(title, options = {}) {
            triggerHapticFeedback();
            if (!("Notification" in window)) return;
            
            if (Notification.permission === "granted") {
                try {
                    const iconUrl = options.icon || "https://cdn-icons-png.flaticon.com/512/3602/3602145.png";
                    const notification = new Notification(title, {
                        body: options.body || "A visitor is at your door!",
                        icon: iconUrl,
                        badge: iconUrl,
                        tag: options.tag || ("safedoor-" + Date.now()),
                        renotify: true,
                        requireInteraction: true,
                        silent: false
                    });

                    notification.onclick = function(event) {
                        event.preventDefault();
                        window.focus();
                        this.close();
                    };
                } catch (e) {
                    console.error("Notification popup error:", e);
                }
            } else if (Notification.permission === "default") {
                Notification.requestPermission().then(permission => {
                    updateNotificationUI(permission);
                    if (permission === "granted") {
                        triggerBrowserNotification(title, options);
                    }
                });
            }
        }

        let statsInterval = null;

        function startNetworkQualityMonitor() {
            if (statsInterval) clearInterval(statsInterval);
            
            statsInterval = setInterval(async () => {
                if (!peerConnection) {
                    updateQualityUI(0, "Disconnected");
                    return;
                }

                if (isReconnecting) {
                    updateQualityUI(1, "Reconnecting...", "text-amber-400", "bg-amber-400");
                    return;
                }

                const iceState = peerConnection.iceConnectionState;
                if (iceState === 'disconnected' || iceState === 'failed' || iceState === 'closed') {
                    updateQualityUI(1, "Weak / Reconnecting", "text-amber-400", "bg-amber-400");
                    return;
                }
                if (iceState === 'checking' || iceState === 'new') {
                    updateQualityUI(2, "Connecting...", "text-amber-400", "bg-amber-400");
                    return;
                }

                try {
                    const stats = await peerConnection.getStats();
                    let currentRtt = null;

                    stats.forEach(report => {
                        if (report.type === 'remote-inbound-rtp' && report.roundTripTime !== undefined) {
                            currentRtt = report.roundTripTime * 1000;
                        } else if (report.type === 'candidate-pair' && report.state === 'succeeded' && report.currentRoundTripTime !== undefined) {
                            currentRtt = report.currentRoundTripTime * 1000;
                        }
                    });

                    if (currentRtt === null) {
                        updateQualityUI(4, "HD • Strong Signal", "text-emerald-400", "bg-emerald-400");
                    } else if (currentRtt < 120) {
                        updateQualityUI(4, `HD • Strong (${Math.round(currentRtt)}ms)`, "text-emerald-400", "bg-emerald-400");
                    } else if (currentRtt < 250) {
                        updateQualityUI(3, `Good (${Math.round(currentRtt)}ms)`, "text-emerald-300", "bg-emerald-400");
                    } else if (currentRtt < 450) {
                        updateQualityUI(2, `Fair (${Math.round(currentRtt)}ms)`, "text-amber-400", "bg-amber-400");
                    } else {
                        updateQualityUI(1, `Poor (${Math.round(currentRtt)}ms)`, "text-red-400", "bg-red-500");
                    }
                } catch (e) {
                    updateQualityUI(3, "HD • Connected", "text-emerald-400", "bg-emerald-400");
                }
            }, 1500);
        }

        function stopNetworkQualityMonitor() {

        let pendingOffer = null;

        async function hostCall() {
            if (peerConnection) cleanup();
            addDebugLog('INIT', 'Resident hosting WebRTC call...', { isCaller, visitorName, token, ntfyTopic });
            try {
                addDebugLog('MEDIA', 'Requesting microphone access (getUserMedia)...');
                localStream = await navigator.mediaDevices.getUserMedia({ audio: true, video: false });
                addDebugLog('MEDIA', 'Microphone granted', { tracks: localStream.getAudioTracks().map(t => ({ label: t.label, enabled: t.enabled, readyState: t.readyState })) });
            } catch (e) {
                addDebugLog('ERROR', 'Microphone error: ' + e.message, e);
                alert("Microphone permission required for Audio Call.");
                cleanup();
                return;
            }

            addDebugLog('INIT', 'Creating RTCPeerConnection...', { iceServersCount: rtcConfig.iceServers.length });
            peerConnection = new RTCPeerConnection(rtcConfig);
            
            localStream.getTracks().forEach(track => {
                peerConnection.addTrack(track, localStream);
                addDebugLog('MEDIA', `Added local track (${track.kind}) to peerConnection`);
            });

            peerConnection.ontrack = (event) => {
                addDebugLog('MEDIA', 'Received remote audio track from Visitor', { streamId: event.streams[0]?.id, trackKind: event.track?.kind });
                const remoteAudio = document.getElementById('remoteAudio');
                if (remoteAudio) {
                    const stream = (event.streams && event.streams[0]) ? event.streams[0] : new MediaStream([event.track]);
                    remoteAudio.srcObject = stream;
                    remoteAudio.play().then(() => {
                        addDebugLog('MEDIA', 'Remote audio playing successfully!');
                    }).catch(err => addDebugLog('WARN', 'Autoplay blocked: ' + err.message));
                }
            };

            peerConnection.onicecandidate = (event) => {
                if (event.candidate) {
                    addDebugLog('ICE', 'Generated local ICE candidate', { protocol: event.candidate.protocol, snippet: event.candidate.candidate.substring(0, 50) });
                    sendCallSignal(`ice:${encodeSignal(JSON.stringify(event.candidate))}`);
                } else {
                    addDebugLog('ICE', 'Local ICE candidate gathering complete');
                }
            };

            peerConnection.onconnectionstatechange = () => {
                const state = peerConnection.connectionState;
                addDebugLog('RTC STATE', `connectionState -> ${state}`);
                if (state === 'connected') {
                    setReconnectingUI(false);
                    startCallTimer();
                } else if (state === 'connecting' || state === 'disconnected') {
                    if (callSeconds > 0) setReconnectingUI(true);
                } else if (state === 'failed' || state === 'closed') {
                    cleanup();
                }
            };

            peerConnection.oniceconnectionstatechange = () => {
                const iceState = peerConnection.iceConnectionState;
                addDebugLog('RTC STATE', `iceConnectionState -> ${iceState}`);
                if (iceState === 'connected' || iceState === 'completed') {
                    setReconnectingUI(false);
                    startCallTimer();
                } else if (iceState === 'disconnected' || iceState === 'checking') {
                    if (callSeconds > 0) setReconnectingUI(true);
                } else if (iceState === 'failed') {
                    cleanup();
                }
            };

            peerConnection.onsignalingstatechange = () => {
                addDebugLog('RTC STATE', `signalingState -> ${peerConnection.signalingState}`);
            };

            try {
                addDebugLog('SIGNAL OUT', 'Creating SDP Offer...');
                const offer = await peerConnection.createOffer();
                addDebugLog('SIGNAL OUT', 'Setting Local Description (Offer)...', { type: offer.type });
                await peerConnection.setLocalDescription(offer);
                addDebugLog('SIGNAL OUT', 'Sending Offer signal to Visitor...');
                sendCallSignal(`initiate:${encodeSignal(JSON.stringify(offer))}`);
                document.getElementById('callStatus').innerText = "Calling Visitor...";
            } catch(e) {
                addDebugLog('ERROR', 'Error creating/setting offer: ' + e.message, e);
            }
        }

                    sendCallSignal(`ice:${encodeSignal(JSON.stringify(event.candidate))}`);
                } else {

            };

            peerConnection.onconnectionstatechange = () => {

                addDebugLog('RTC STATE', `connectionState -> ${state}`);
                if (state === 'connected') {

                } else if (state === 'connecting' || state === 'disconnected') {

            peerConnection.oniceconnectionstatechange = () => {

                if (iceState === 'connected' || iceState === 'completed') {

                    if (callSeconds > 0) setReconnectingUI(true);

                    cleanup();
                }
            };

            peerConnection.onsignalingstatechange = () => {
                addDebugLog('RTC STATE', `signalingState -> ${peerConnection.signalingState}`);
            };

            try {
                addDebugLog('SIGNAL IN', 'Setting Remote Description (Offer)...', { type: offerSdp.type });
                await peerConnection.setRemoteDescription(new RTCSessionDescription(offerSdp));

                addDebugLog('ICE', `Flushing queued ICE candidates (${iceCandidatesQueue.length})...`);
                while (iceCandidatesQueue.length > 0) {
                    const cand = iceCandidatesQueue.shift();
                    if (cand) {

                }

                const answer = await peerConnection.createAnswer();

                await peerConnection.setLocalDescription(answer);
                addDebugLog('SIGNAL OUT', 'Sending Answer signal to Visitor...');
                sendCallSignal(`answer:${encodeSignal(JSON.stringify(answer))}`);
                document.getElementById('callStatus').innerText = "Connecting...";
            } catch (e) {
                addDebugLog('ERROR', 'Error setting offer or creating answer: ' + e.message, e);
            }
        }

        function setupSseListener() {
            addDebugLog('INIT', 'Subscribing to ntfy signaling stream...', { ntfyTopic });
            eventSource = new EventSource(`https://ntfy.sh/${ntfyTopic}/sse?since=10s`);

            eventSource.onopen = () => {
                addDebugLog('SIGNAL IN', 'SSE channel connected');
            };

            eventSource.onerror = (err) => {
                addDebugLog('WARN', 'SSE channel error or reconnecting', err);
            };

            eventSource.onmessage = async (event) => {
                try {
                    const data = JSON.parse(event.data);
                    if (data.event === "message") {
                        const payload = JSON.parse(data.message);
                        if (payload.type === "chat_message" && payload.sender === "Visitor") {
                            const message = payload.message;
                            if (message && message.startsWith("_webrtc_call_:")) {
                                const msgTimestamp = Number(payload.timestamp) || (data.time ? data.time * 1000 : 0);
                                if (msgTimestamp > 0 && msgTimestamp < callSessionStartTime) {
                                    addDebugLog('SIGNAL IN', `Ignoring stale replayed WebRTC signal (${message.substring(0, 30)}...)`, { msgTimestamp, callSessionStartTime });
                                    return;
                                }

                                const signalData = message.substring("_webrtc_call_:".length);
                                const firstColonIndex = signalData.indexOf(":");
                                const command = firstColonIndex !== -1 ? signalData.substring(0, firstColonIndex) : signalData;
                                const payloadStr = firstColonIndex !== -1 ? signalData.substring(firstColonIndex + 1) : "";

                                addDebugLog('SIGNAL IN', `Received signal command '${command}' from Visitor`);

                                if (command === "initiate") {
                                    if (payloadStr) {
                                        try {
                                            pendingOffer = JSON.parse(decodeSignal(payloadStr));
                                            addDebugLog('SIGNAL IN', 'Parsed Visitor offer SDP', { type: pendingOffer.type });
                                            if (!isCaller && !peerConnection) {
                                                await joinCall(pendingOffer);
                                                pendingOffer = null;
                                            }
                                        } catch(e) {
                                            addDebugLog('ERROR', "Error parsing offer SDP: " + e.message, e);
                                        }
                                    }
                                } else if (command === "answer") {
                                    if (payloadStr && peerConnection) {
                                        try {
                                            const answerSdp = JSON.parse(decodeSignal(payloadStr));
                                            addDebugLog('SIGNAL IN', 'Setting Remote Description (Answer)...', { type: answerSdp.type });
                                            await peerConnection.setRemoteDescription(new RTCSessionDescription(answerSdp));
                                            
                                            addDebugLog('ICE', `Flushing queued ICE candidates (${iceCandidatesQueue.length})...`);
                                            while (iceCandidatesQueue.length > 0) {
                                                const cand = iceCandidatesQueue.shift();
                                                if (cand) {
                                                    await peerConnection.addIceCandidate(new RTCIceCandidate(cand)).catch(e => addDebugLog('ERROR', 'Queued ICE error: ' + e.message));
                                                }
                                            }
                                            document.getElementById('callStatus').innerText = "Connecting...";
                                        } catch(e) {
                                            addDebugLog('ERROR', "Error setting answer SDP: " + e.message, e);
                                        }
                                    }
                                } else if (command === "ice") {
                                    if (payloadStr) {
                                        try {
                                            const candidate = JSON.parse(decodeSignal(payloadStr));
                                            if (peerConnection && peerConnection.remoteDescription && peerConnection.remoteDescription.type) {
                                                addDebugLog('ICE', 'Adding remote ICE candidate...');
                                                await peerConnection.addIceCandidate(new RTCIceCandidate(candidate)).catch(e => addDebugLog('WARN', "ICE candidate add error: " + e.message));
                                            } else {
                                                addDebugLog('ICE', 'Queued remote ICE candidate (remote description pending)');
                                                iceCandidatesQueue.push(candidate);
                                            }
                                        } catch(e) {
                                            addDebugLog('ERROR', "Error parsing ICE candidate: " + e.message, e);
                                        }
                                    }
                                } else if (command === "decline") {
                                    addDebugLog('SIGNAL IN', 'Visitor declined call');
                                    alert("Visitor is unavailable.");
                                    cleanup();
                                } else if (command === "hangup") {
                                    addDebugLog('SIGNAL IN', 'Visitor hung up');
                                    cleanup();
                                }
                            } else {
                                triggerBrowserNotification(`💬 Message from ${payload.sender}`, {
                                    body: message,
                                    tag: "safedoor-chat-msg"
                                });
                            }
                        } else if (payload.visitorName || payload.type === "ring_bell") {
                            triggerBrowserNotification("🔔 SafeDoor Alert: Visitor Arrived!", {
                                body: `${payload.visitorName || "Visitor"} (${payload.purpose || "At Door"}) is ringing your doorbell!`,
                                tag: "safedoor-visitor-arrived"
                            });
                        }
                    }
                } catch (e) {
                    addDebugLog('WARN', "Error processing SSE payload: " + e.message);
                }
            };
        }

        function toggleMute() {
            if (localStream) {
                isMuted = !isMuted;
                localStream.getAudioTracks().forEach(track => {
                    track.enabled = !isMuted;
                });
                
                const muteIcon = document.getElementById('muteIcon');
                const muteText = document.getElementById('muteText');
                if (isMuted) {
                    muteIcon.className = "fa-solid fa-microphone text-emerald-400 animate-pulse";
                    muteText.innerText = "Unmute";
                } else {
                    muteIcon.className = "fa-solid fa-microphone-slash text-slate-300";
                    muteText.innerText = "Mute";
                }
            }
        }

        let isSpeakerphoneOn = true;

        async function toggleSpeakerphoneOwner() {
            isSpeakerphoneOn = !isSpeakerphoneOn;

            if (window.AndroidCall && typeof window.AndroidCall.setSpeakerphone === 'function') {
                try {
                    window.AndroidCall.setSpeakerphone(isSpeakerphoneOn);
                } catch (e) {
                    console.warn("AndroidCall setSpeakerphone failed:", e);
                }
            }

            const remoteAudio = document.getElementById('remoteAudio');
            if (remoteAudio && typeof remoteAudio.setSinkId === 'function' && navigator.mediaDevices && navigator.mediaDevices.enumerateDevices) {
                try {
                    const devices = await navigator.mediaDevices.enumerateDevices();
                    const audioOutputs = devices.filter(d => d.kind === 'audiooutput');
                    if (audioOutputs.length > 1) {
                        const targetDevice = audioOutputs.find(d => 
                            isSpeakerphoneOn ? (d.label.toLowerCase().includes('speaker') || d.deviceId === 'default') 
                                             : (d.label.toLowerCase().includes('earpiece') || d.label.toLowerCase().includes('handset') || d.label.toLowerCase().includes('telephony'))
                        ) || (isSpeakerphoneOn ? audioOutputs[0] : audioOutputs[audioOutputs.length - 1]);
                        
                        if (targetDevice && targetDevice.deviceId) {
                            await remoteAudio.setSinkId(targetDevice.deviceId);
                        }
                    }
                } catch (err) {
                    console.warn("setSinkId route error:", err);
                }
            }

            updateSpeakerphoneOwnerUi();
        }

        function updateSpeakerphoneOwnerUi() {
            const btnText = document.getElementById('speakerOwnerText');
            const icon = document.getElementById('speakerOwnerIcon');
            const btn = document.getElementById('speakerOwnerBtn');
            if (isSpeakerphoneOn) {
                if (btnText) btnText.innerText = "Speakerphone";
                if (icon) icon.className = "fa-solid fa-volume-high text-emerald-400";
                if (btn) {
                    btn.className = "py-3.5 bg-slate-900 hover:bg-slate-800 border border-emerald-500/30 font-bold rounded-2xl text-xs transition duration-150 flex items-center justify-center gap-2 text-emerald-400";
                }
            } else {
                if (btnText) btnText.innerText = "Handset Audio";
                if (icon) icon.className = "fa-solid fa-ear-listen text-amber-400";
                if (btn) {
                    btn.className = "py-3.5 bg-slate-900 hover:bg-slate-800 border border-amber-500/30 font-bold rounded-2xl text-xs transition duration-150 flex items-center justify-center gap-2 text-amber-300";
                }
            }
        }

        function hangup() {
            sendCallSignal("hangup");
            cleanup();
        }

        function cleanup() {
            isReconnecting = false;
            if (reconnectTimeout) {
                clearTimeout(reconnectTimeout);
                reconnectTimeout = null;
            }
            const badge = document.getElementById('reconnectingBadge');
            if (badge) badge.classList.add('hidden');
            const ring = document.getElementById('reconnectingRing');
            if (ring) ring.classList.add('hidden');

            stopCallTimer();
            stopNetworkQualityMonitor();
            if (eventSource) {
                eventSource.close();
                eventSource = null;
            }
            if (peerConnection) {
                try { peerConnection.close(); } catch(e) {}
                peerConnection = null;
            }
            if (localStream) {
                try { localStream.getTracks().forEach(track => track.stop()); } catch(e) {}
                localStream = null;
            }
            const remoteAudio = document.getElementById('remoteAudio');
            if (remoteAudio) {
                remoteAudio.srcObject = null;
            }
            
            // Notify native Android container that call ended
            if (window.AndroidCall) {
                window.AndroidCall.onCallEnded();
            }
        }

        // Start call process
        addDebugLog('INIT', 'Call screen loaded successfully', { token: token ? (token.substring(0, 8) + '...') : 'null', visitorName, isCaller, visitorTimestamp, ntfyTopic });
        initNotificationSystem();
        setupSseListener();
        if (isCaller) {
            hostCall();
        } else {
            document.getElementById('callStatus').innerText = "Connecting...";
            if (pendingOffer) {
                joinCall(pendingOffer);
                pendingOffer = null;
            }
        }
    </script>
</body>
</html>
